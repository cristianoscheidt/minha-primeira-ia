
name: Comparar preços de farmácias

on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Digite o produto para pesquisar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Pesquisar preços e enviar Telegram
        env:
          PRODUCT: ${{ inputs.produto }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python farmacias.py
