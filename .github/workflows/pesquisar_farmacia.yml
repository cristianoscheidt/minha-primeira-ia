
name: Comparar preços de farmácias

on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Digite o produto para pesquisar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3

      - name: Verificar configuração
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import os; assert os.getenv('TAVILY_API_KEY'), 'TAVILY_API_KEY ausente'; assert os.getenv('TELEGRAM_TOKEN'), 'TELEGRAM_TOKEN ausente'; assert os.getenv('TELEGRAM_CHAT_ID'), 'TELEGRAM_CHAT_ID ausente'; print('Credenciais configuradas.')"

      - name: Pesquisar preços e enviar Telegram
        env:
          PRODUCT: ${{ inputs.produto }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python farmacias.py
