name: Comparar preços de farmácias

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Produto para pesquisar (ex.: creme dental Colgate Total 12 90g)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Consultar farmácias e enviar Telegram
        env:
          PRODUCT_NAME: ${{ inputs.product }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python comparar.py
