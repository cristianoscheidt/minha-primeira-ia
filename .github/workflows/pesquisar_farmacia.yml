name: Comparar preços de farmácias

on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Produto para pesquisar (ex.: creme dental Colgate Total 12 90g)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Pesquisar preços e enviar ao Telegram
        env:
          PRODUCT: ${{ inputs.produto }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python farmacias.py
