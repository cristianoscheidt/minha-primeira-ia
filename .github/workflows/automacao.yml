name: Rodar IA Automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  executar-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python na nuvem
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: pip install google-genai requests

      - name: Executar o código da IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo_ia.py

      - name: Salvar o resultado no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robô IA"
          git add README.md historico.json
          git commit -m "Atualização automática da IA" || exit 0
          git push
